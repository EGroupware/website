name: Deploy staging site

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SSH push was abandoned: docker.egroupware.org's firewall allow-lists SSH by
      # source IP, and GitHub-hosted runners use thousands of rotating Azure ranges
      # that can't reasonably be allow-listed. Port 443 is already open to everyone
      # for the sites themselves, so we trigger over HTTPS instead, authenticated by
      # an HMAC-SHA256 signature (verified server-side by a webhook listener that
      # only ever runs its own fixed git-fetch-and-reset-hard script - no deploy
      # logic or secrets live in this workflow).
      - name: Trigger deploy via webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}
        run: |
          PAYLOAD="{\"ref\":\"${{ github.sha }}\"}"
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -sf -X POST https://staging.egroupware.org/hooks/deploy-staging \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            --data "$PAYLOAD"
